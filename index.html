<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>날씨 앱</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <header class="app-header">
      <h1>날씨</h1>
      <button type="button" id="locate-btn" class="icon-btn" title="현재 위치로 검색">📍</button>
    </header>

    <form id="search-form" class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="city-input" placeholder="도시 이름 입력 (예: 서울)" autocomplete="off" required>
      <button type="submit" class="search-btn">검색</button>
    </form>

    <main class="chat-room">
      <div id="status" class="status"></div>

      <section id="result" class="bubble-row hidden">
        <div class="avatar" id="weather-icon"></div>
        <div class="bubble">
          <div class="bubble-tail"></div>
          <div class="bubble-top">
            <span id="city-name" class="city-name"></span>
            <span id="date-time" class="date-time"></span>
          </div>
          <div class="temp-line">
            <span id="temperature" class="temperature"></span><span class="deg">°C</span>
            <p id="description" class="description"></p>
          </div>
          <div class="details">
            <div class="detail-item">
              <span class="label">체감온도</span>
              <span id="feels-like" class="value"></span>
            </div>
            <div class="detail-item">
              <span class="label">습도</span>
              <span id="humidity" class="value"></span>
            </div>
            <div class="detail-item">
              <span class="label">풍속</span>
              <span id="wind-speed" class="value"></span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <div class="nav-item active">
        <span class="nav-icon">☀️</span>
        <span>날씨</span>
      </div>
      <div class="nav-item">
        <span class="nav-icon">💬</span>
        <span>친구</span>
      </div>
      <div class="nav-item">
        <span class="nav-icon">🛒</span>
        <span>쇼핑</span>
      </div>
      <div class="nav-item">
        <span class="nav-icon">⋯</span>
        <span>더보기</span>
      </div>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
